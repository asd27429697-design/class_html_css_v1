<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 2px solid green;
        padding: 10px;
        /* flex */
        display: flex;
        /* 1 규칙 부모 상자가 flex 로 설정 되어야 한다 */
        /* 주축 방향을 설정하는 개념 */
        flex-direction: row;
      }
      .item {
        width: 100px;
        height: 100px;
        background-color: tomato;
        margin: 5px;
        text-align: center;
        color: white;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
    </div>
  </body>
</html>
