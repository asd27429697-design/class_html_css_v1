<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        width: 200px;
        height: 200px;
        padding: 10px;
        border: 2px solid green;
        background-color: rebeccapurple;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
      }
      .item {
        height: 100px;
        width: 100px;
        background-color: skyblue;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">item child</div>
    </div>
  </body>
</html>
