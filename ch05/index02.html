<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나만의 프로필</title>
  </head>
  <body>
    <!-- src 속성 -->
    <img src="https://picsum.photos/id/20/200/200" alt="샘플 이미지" />

    <p>
      <a href="https://www.gogle.com" target="_blank">내 포트폴리오 가기</a>
    </p>
    <!-- placeholder 속성, maxlength -->
    <input type="text" placeholder="한줄 소개를 입력하세요" maxlength="10" />

    <!-- disabled 속성 : 비활성화 -->
    <button disabled>아직 준비중</button>
  </body>
</html>
